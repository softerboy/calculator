# Production stack. The box holds no checkout: CI drives this file over a remote
# Docker context (see .github/workflows/deploy.yml). The container joins the
# shared external `edge` network, where the edge proxy (softerboy/infra) reaches
# it as calculator:8080 for calculator.fumarov.me.
services:
  calculator:
    image: ${IMAGE:-ghcr.io/softerboy/calculator:latest}
    container_name: calculator
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - edge

networks:
  edge:
    external: true
